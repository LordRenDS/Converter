<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBZ to EPUB Converter</title>
    <link rel="stylesheet" href="src/css/styles.css">
    <!-- Include JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>CBZ to EPUB Converter</h1>
        <p>Convert your comic books completely offline in your browser.</p>

        <div class="drop-zone" id="drop-zone">
            <span class="drop-zone__prompt">Drop .cbz files here or click to upload</span>
            <input type="file" id="file-input" accept=".cbz,.zip" class="drop-zone__input" multiple>
        </div>

        <ul class="file-list" id="file-list"></ul>

        <div class="metadata-form">
            <input type="text" id="title-input" placeholder="Book Title (optional)">
            <input type="text" id="author-input" placeholder="Author (optional)">
        </div>
        <div class="options-form">
                        <div class="cover-options-group">
                <label>Cover Image Source:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="cover-source" value="page" checked>
                        Use Page from Book
                    </label>
                    <label>
                        <input type="radio" name="cover-source" value="custom">
                        Upload Custom Cover
                    </label>
                </div>

                <div id="cover-page-input-group" class="cover-input-subgroup">
                    <label for="cover-page-input">Page Number for Cover:</label>
                    <input type="number" id="cover-page-input" min="1" value="1">
                </div>

                <div id="cover-file-input-group" class="cover-input-subgroup" style="display: none;">
                    <label for="cover-input">Custom Cover (optional):</label>
                    <input type="file" id="cover-input" accept=".jpg,.jpeg,.png">
                </div>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" id="landscape-spread-checkbox">
                Landscape Spread
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="offset-first-page-checkbox">
                Offset First Page
            </label>
            <label class="checkbox-label" id="merge-group">
                <input type="checkbox" id="merge-checkbox" disabled>
                Merge into single EPUB
            </label>
            <div class="select-group" id="spread-mode-group">
                <label for="spread-mode-select">Spread Splitter / Handling:</label>
                <select id="spread-mode-select">
                    <option value="off">Off (Do not split or rotate)</option>
                    <option value="split" selected>Split into 2 pages</option>
                    <option value="rotate">Rotate spread only</option>
                    <option value="both">Split and include full spread</option>
                </select>
            </div>
            <div id="spread-suboptions-group" class="suboptions-group" style="display: none;">
                <label class="checkbox-label" id="spread-no-rotate-group">
                    <input type="checkbox" id="spread-no-rotate-checkbox">
                    Do not rotate wide spread
                </label>
                <label class="checkbox-label" id="spread-rotate-right-group">
                    <input type="checkbox" id="spread-rotate-right-checkbox">
                    Rotate clockwise (90° right)
                </label>
                <div class="select-group" id="spread-position-group" style="display: none;">
                    <label for="spread-position-select">Wide spread position:</label>
                    <select id="spread-position-select">
                        <option value="after" selected>After split pages</option>
                        <option value="before">Before split pages</option>
                    </select>
                </div>
            </div>
            <div class="select-group">
                <label for="direction-select">Reading Direction:</label>
                <select id="direction-select">
                    <option value="ltr">Comic (Left-to-Right)</option>
                    <option value="rtl">Manga (Right-to-Left)</option>
                </select>
            </div>
            <div class="select-group" id="format-group">
                <label for="format-select">Image Format:</label>
                <select id="format-select">
                    <option value="original">Original Format</option>
                    <option value="jpeg">JPEG (Smaller size)</option>
                    <option value="png">PNG (Standard 24/32-bit)</option>
                    <option value="png_8bit">PNG 8-bit (256 grays)</option>
                    <option value="png_4bit">PNG 4-bit (16 grays E-Ink)</option>
                </select>
            </div>
            <div class="select-group" id="quality-group" style="display: none;">
                <label for="quality-input">JPEG Quality (1-100):</label>
                <input type="number" id="quality-input" min="1" max="100" value="85" title="Optimal value is around 85">
            </div>
            <div class="select-group" id="device-group">
                <label for="device-select">Target Device Profile:</label>
                <select id="device-select">
                    <option value="original">Original (No resize)</option>
                    <option value="kindle_pw12" selected>Kindle Paperwhite 12 (7" - 1272x1696)</option>
                    <option value="kindle_pw11">Kindle Paperwhite 11 (6.8" - 1236x1648)</option>
                    <option value="kindle_oasis">Kindle Oasis 2/3 (7" - 1264x1680)</option>
                    <option value="kindle_pw34">Kindle Paperwhite 3/4 / Voyage / Basic (1072x1448)</option>
                    <option value="kindle_scribe">Kindle Scribe (10.2" - 1860x2480)</option>
                </select>
            </div>
            <label class="checkbox-label" id="upscale-group">
                <input type="checkbox" id="upscale-checkbox" checked>
                Upscale small images to device resolution
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="grayscale-checkbox">
                Convert to Grayscale (B/W)
            </label>
        </div>


        <button id="convert-btn" disabled>Convert</button>

        <div class="progress-container" id="progress-container" style="display: none;">
            <p id="status-text">Processing...</p>
            <div class="progress-bar">
                <div class="progress-bar__fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
    <script type="module" src="src/js/main.js"></script>
</body>
</html>
