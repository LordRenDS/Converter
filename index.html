<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBZ to EPUB Converter</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Include JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>CBZ to EPUB Converter</h1>
        <p>Convert your comic books completely offline in your browser.</p>

        <div class="drop-zone" id="drop-zone">
            <span class="drop-zone__prompt">Drop .cbz file here or click to upload</span>
            <input type="file" id="file-input" accept=".cbz,.zip" class="drop-zone__input">
        </div>

        <div class="metadata-form">
            <input type="text" id="title-input" placeholder="Book Title (optional)">
            <input type="text" id="author-input" placeholder="Author (optional)">
        </div>
        <div class="options-form">
            <label class="checkbox-label">
                <input type="checkbox" id="optimize-checkbox">
                Optimize for E-readers (Split wide spreads)
            </label>
            <div class="select-group">
                <label for="direction-select">Reading Direction:</label>
                <select id="direction-select">
                    <option value="ltr">Comic (Left-to-Right)</option>
                    <option value="rtl">Manga (Right-to-Left)</option>
                </select>
            </div>
            <div class="select-group" id="format-group" style="opacity: 0.5; pointer-events: none;">
                <label for="format-select">Split Format:</label>
                <select id="format-select" disabled>
                    <option value="original">Original Format</option>
                    <option value="jpeg">JPEG (Smaller size)</option>
                </select>
            </div>
        </div>


        <button id="convert-btn" disabled>Convert</button>

        <div class="progress-container" id="progress-container" style="display: none;">
            <p id="status-text">Processing...</p>
            <div class="progress-bar">
                <div class="progress-bar__fill" id="progress-fill"></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
